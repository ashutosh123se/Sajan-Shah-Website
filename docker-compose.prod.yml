version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ss_website_db_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: "ss_website_db"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_prod:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: ss_website_backend_prod
    restart: always
    environment:
      - DATABASE_URL=mysql://root:${DB_PASSWORD}@db:3306/ss_website_db
      - PORT=5001
      - NODE_ENV=production
    env_file:
      - ./backend/.env.prod
    ports:
      - "5001:5001"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: ss_website_frontend_prod
    restart: always
    env_file:
      - ./frontend/.env.prod.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data_prod:
