version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ss_website_db
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "ss_website_db"
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: ss_website_backend
    environment:
      - DATABASE_URL=mysql://root:@db:3306/ss_website_db
      - PORT=5001
      - NODE_ENV=development
    env_file:
      - ./backend/.env
    ports:
      - "5001:5001"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: ss_website_frontend
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
