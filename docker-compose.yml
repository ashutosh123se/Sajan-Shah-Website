version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: sajanshah
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sajanshah_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/sajanshah
      - JWT_SECRET=your_jwt_secret_min_32_chars_CHANGE_THIS
      - JWT_REFRESH_SECRET=your_refresh_secret_DIFFERENT_FROM_ABOVE
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
      - NODE_ENV=production
      # Add other environment variables as needed here
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sajanshah_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      # Add other environment variables as needed here
    depends_on:
      - backend

volumes:
  pgdata:
